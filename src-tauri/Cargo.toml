[package]
name = "lume"
version = "1.4.4"
edition = "2021"
description = "Compartilhamento de tela P2P portátil"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# O app completo (captura, codificador, áudio e conexões nativas) é só do Windows.
[target.'cfg(windows)'.dependencies]
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
flate2 = "1"
windows-capture = "2.0.1"
webrtc = "0.21.1"
openh264 = "0.9.10"
tokio = { version = "1.54.1", features = ["full"] }
wasapi = "0.27.0"
rtc = "0.21.1"
bytes = "1.12.1"
async-trait = "0.1.92"
unsafe-libopus = "0.2.0"
windows = { version = "0.62.2", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
rumqttc = { version = "0.25.1", default-features = false }
chacha20poly1305 = "0.11.0"
igd-next = { version = "0.17", features = ["aio_tokio"] }
local-ip-address = "0.6"
scrypt = { version = "0.11", default-features = false }
hex = "0.4"
netdev = "0.31"

# No Linux, a interface roda no WebKitGTK; precisamos dele para ligar o WebRTC e a captura.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_38"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
