[package]
name = "lume"
version = "0.1.0"
edition = "2021"
description = "Compartilhamento de tela P2P portátil"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
flate2 = "1"
windows-capture = "2.0.1"
webrtc = "0.21.1"
openh264 = "0.9.10"
tokio = { version = "1.54.1", features = ["full"] }
wasapi = "0.27.0"
rtc = "0.21.1"
bytes = "1.12.1"
async-trait = "0.1.92"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
